<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="mlmGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="30%" stop-color="#F5E2B8"/>
      <stop offset="65%" stop-color="#C5A869"/>
      <stop offset="100%" stop-color="#846830"/>
    </linearGradient>
    <linearGradient id="mlmGoldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF8EB"/>
      <stop offset="50%" stop-color="#DFC89D"/>
      <stop offset="100%" stop-color="#C5A869"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C5A869" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- LOGO EMBLEM (Left: 64x64 centered at x=40, y=40) -->
  <g transform="translate(10, 8)" filter="url(#goldGlow)">
    <!-- Rounded Outer Badge -->
    <rect x="0" y="0" width="64" height="64" rx="18" fill="#06080D" stroke="url(#mlmGoldGrad)" stroke-width="1.8"/>
    
    <!-- EMBLEM GRAPHIC -->
    <g transform="translate(8, 8) scale(1)">
      <!-- Diamond Apex Crown -->
      <polygon points="24,3 32,10 24,15 16,10" fill="url(#mlmGoldGrad)" stroke="#FFE8B5" stroke-width="0.8"/>
      <line x1="24" y1="3" x2="24" y2="15" stroke="#FFE8B5" stroke-width="0.7"/>
      
      <!-- Left Hemisphere Neural Network -->
      <path d="M 22,17 L 13,19 L 8,25 L 9,33 L 15,39 L 22,44 Z" fill="none" stroke="url(#mlmGoldGrad)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 13,19 L 20,27 L 15,39" fill="none" stroke="url(#mlmGoldGrad)" stroke-width="1.1" stroke-linejoin="round" stroke-opacity="0.8"/>
      <path d="M 8,25 L 20,27 L 22,17" fill="none" stroke="url(#mlmGoldGrad)" stroke-width="1" stroke-linejoin="round" stroke-opacity="0.7"/>
      <path d="M 9,33 L 20,27 L 22,44" fill="none" stroke="url(#mlmGoldGrad)" stroke-width="1" stroke-linejoin="round" stroke-opacity="0.7"/>

      <!-- Right Hemisphere Neural Network -->
      <path d="M 26,17 L 35,19 L 40,25 L 39,33 L 33,39 L 26,44 Z" fill="none" stroke="url(#mlmGoldGrad)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 35,19 L 28,27 L 33,39" fill="none" stroke="url(#mlmGoldGrad)" stroke-width="1.1" stroke-linejoin="round" stroke-opacity="0.8"/>
      <path d="M 40,25 L 28,27 L 26,17" fill="none" stroke="url(#mlmGoldGrad)" stroke-width="1" stroke-linejoin="round" stroke-opacity="0.7"/>
      <path d="M 39,33 L 28,27 L 26,44" fill="none" stroke="url(#mlmGoldGrad)" stroke-width="1" stroke-linejoin="round" stroke-opacity="0.7"/>

      <!-- Synaptic Core Bridge -->
      <line x1="22" y1="27" x2="26" y2="27" stroke="url(#mlmGoldGrad)" stroke-width="2"/>
      <line x1="22" y1="36" x2="26" y2="36" stroke="url(#mlmGoldGrad)" stroke-width="1.5"/>

      <!-- Network Marketing Luminous Nodes -->
      <circle cx="24" cy="9" r="1.5" fill="#FFFDF7"/>
      <circle cx="13" cy="19" r="1.6" fill="#DFC89D"/>
      <circle cx="35" cy="19" r="1.6" fill="#DFC89D"/>
      <circle cx="20" cy="27" r="2.2" fill="#2DD4BF"/>
      <circle cx="28" cy="27" r="2.2" fill="#2DD4BF"/>
      <circle cx="8" cy="25" r="1.4" fill="#C5A869"/>
      <circle cx="40" cy="25" r="1.4" fill="#C5A869"/>
      <circle cx="15" cy="39" r="1.5" fill="#DFC89D"/>
      <circle cx="33" cy="39" r="1.5" fill="#DFC89D"/>
      <circle cx="24" cy="44" r="1.8" fill="#FFFDF7"/>
    </g>
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <g transform="translate(90, 20)">
    <text x="0" y="30" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
      MLM <tspan fill="url(#mlmGoldAccent)">BRAIN</tspan>
    </text>
    <text x="2" y="46" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" letter-spacing="3" fill="#94A3B8">
      HỆ ĐIỀU HÀNH KINH DOANH MẠNG LƯỚI
    </text>
  </g>
</svg>
